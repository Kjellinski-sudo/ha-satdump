name: Dateien (File Browser)
version: "0.1.0"
slug: dateien
description: Kleiner Datei-Manager nur für den USB-Stick. Kein Zugriff auf Home Assistant, erreichbar über den Cloudflare-Tunnel (dateien.kjellh.de).
url: https://github.com/Kjellinski-sudo/ha-satdump
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
# Zum Einbinden des Sticks im Container nötig (mount). Kein Host-Netz, keine offenen Ports:
# nur der Cloudflare-Tunnel erreicht die App intern unter http://1791b5d0-dateien:8080
privileged:
  - SYS_ADMIN
apparmor: false
devices:
  - /dev/sda1
options:
  stick_label: ESD-USB
  username: ""
  password: ""
schema:
  stick_label: str
  username: str
  password: password
