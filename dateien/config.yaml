name: Dateien (FileBrowser Quantum)
version: "0.7.4"
slug: dateien
description: Datei-Manager nur für die USB-Sticks (FileBrowser Quantum, Neon-Design). Kein Zugriff auf Home Assistant, erreichbar über den Cloudflare-Tunnel (dateien.kjellh.de).
url: https://github.com/Kjellinski-sudo/ha-satdump
arch:
  - aarch64
  - amd64
startup: application
# Supervisor startet die App neu, wenn sie abstürzt (Port 8080 antwortet nicht mehr)
watchdog: "tcp://[HOST]:8080"
boot: auto
init: false
# Zum Einbinden des Sticks im Container nötig (mount). Kein Host-Netz, keine offenen Ports:
# nur der Cloudflare-Tunnel erreicht die App intern unter http://1791b5d0-dateien:8080
privileged:
  - SYS_ADMIN
apparmor: false
# Meldet Stick-Belegung und fehlgeschlagene Anmeldungen an Home Assistant (v0.1.1)
homeassistant_api: true
# Gäste anlegen/löschen aus Home Assistant (hassio.addon_stdin), v0.3.0
stdin: true
# Sticks werden per Name (Label) gefunden; fehlende Geräte überspringt der Supervisor
devices:
  - /dev/sda1
  - /dev/sdb1
  - /dev/sdc1
options:
  stick_label: ESD-USB
  stick2_label: ""
  username: ""
  password: ""
  push_dienst: mobile_app_kjells_apfel
  passwort_per_push: false
schema:
  stick_label: str
  stick2_label: str?
  username: str
  password: password
  push_dienst: str?
  passwort_per_push: bool?
