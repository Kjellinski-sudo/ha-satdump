# Vorschaltung vor FileBrowser Quantum: alles geht unverändert durch, nur „Löschen“
# landet bei der Papierkorb-Weiche (verschiebt nach /Papierkorb statt endgültig zu löschen).
# Zusätzlich wird ein kleines Skript eingebunden: Menüpunkt „Wiederherstellen“ im Papierkorb.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 256; }

http {
    access_log off;
    client_max_body_size 0;
    client_body_temp_path /tmp/nginx-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    map $http_upgrade $verbindung { default upgrade; "" ""; }

    server {
        listen 8080;

        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $verbindung;
        # Echte Absender-IP kommt von cloudflared und wird unverändert weitergereicht
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        location /api/resources {
            if ($request_method = DELETE) {
                proxy_pass http://127.0.0.1:8082;
            }
            proxy_pass http://127.0.0.1:8081;
        }

        location /dateien-api/ {
            limit_except POST { deny all; }
            proxy_pass http://127.0.0.1:8082;
        }

        location = /dateien-extra/papierkorb.js {
            alias /opt/dateien/papierkorb.js;
            default_type application/javascript;
            add_header Cache-Control "no-cache";
        }

        location /api/ {
            proxy_pass http://127.0.0.1:8081;
        }

        location / {
            # Seiten unkomprimiert holen, damit das Zusatz-Skript eingefügt werden kann
            # (proxy_set_header hier ersetzt die Server-Angaben, daher alle wiederholen)
            proxy_set_header Accept-Encoding "";
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $verbindung;
            proxy_set_header X-Forwarded-For $http_x_forwarded_for;
            proxy_set_header X-Real-IP $http_x_real_ip;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            sub_filter_once on;
            sub_filter '</body>' '<script src="/dateien-extra/papierkorb.js"></script></body>';
            proxy_pass http://127.0.0.1:8081;
        }
    }
}
